buildscript {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }

  dependencies {
    def resolvedKotlinVersion = rootProject.ext.has('kotlinVersion')
      ? rootProject.ext.get('kotlinVersion')
      : '2.1.20'
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${resolvedKotlinVersion}")
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${resolvedKotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'com.reactnativescroll.interop'
version = '0.1.0-alpha.1'

android {
  namespace 'com.reactnativescroll.interop'
  compileSdkVersion rootProject.ext.has('compileSdkVersion')
    ? rootProject.ext.get('compileSdkVersion')
    : 35

  defaultConfig {
    minSdkVersion rootProject.ext.has('minSdkVersion')
      ? rootProject.ext.get('minSdkVersion')
      : 24
    targetSdkVersion rootProject.ext.has('targetSdkVersion')
      ? rootProject.ext.get('targetSdkVersion')
      : 35
  }

  buildFeatures {
    compose true
    buildConfig true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation("com.facebook.react:react-android")

  implementation 'androidx.compose.material3:material3:1.5.0-alpha17'
  implementation 'io.coil-kt.coil3:coil-compose:3.3.0'
  implementation 'io.coil-kt.coil3:coil-network-okhttp:3.3.0'
}
